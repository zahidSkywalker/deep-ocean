<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JWT Decoder - ECHO Toolkit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
        :root {
            --bg-primary: #0a0e17; --bg-secondary: #111827; --bg-card: #1a2236;
            --bg-input: #0f172a; --border-color: #1e293b; --border-hover: #334155;
            --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
            --accent-cyan: #06b6d4; --accent-green: #10b981; --accent-yellow: #f59e0b;
            --accent-red: #ef4444; --accent-purple: #a855f7; --sidebar-width: 260px;
            --radius: 10px; --radius-sm: 6px; --transition: .2s ease;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; min-height: 100vh; }
        a { color: var(--accent-cyan); text-decoration: none; transition: color var(--transition); }
        a:hover { color: #22d3ee; }
        ::selection { background: var(--accent-cyan); color: var(--bg-primary); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }
        .app-layout { display: flex; min-height: 100vh; }

        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 1000; overflow-y: auto; }
        .sidebar-brand { padding: 20px 16px; border-bottom: 1px solid var(--border-color); }
        .brand-link { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: var(--accent-cyan); }
        .brand-link:hover { color: #22d3ee; }
        .sidebar-nav { padding: 16px 12px; flex: 1; }
        .nav-category { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); padding: 8px 12px 4px; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 13px; color: var(--text-secondary); border-radius: var(--radius-sm); transition: all var(--transition); cursor: pointer; }
        .nav-link:hover { color: var(--text-primary); background: rgba(6,182,212,.05); }
        .nav-link.active { color: var(--accent-cyan); background: rgba(6,182,212,.08); }
        .nav-link-icon { width: 20px; text-align: center; font-size: 14px; }

        .main-content { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; min-height: 100vh; }
        .tool-container { max-width: 960px; width: 100%; margin: 0 auto; padding: 32px 32px 48px; }
        .tool-header { margin-bottom: 32px; }
        .tool-header h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .tool-header-icon { width: 44px; height: 44px; border-radius: var(--radius); background: rgba(6,182,212,.12); border: 1px solid rgba(6,182,212,.2); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .tool-header p { font-size: 14px; color: var(--text-secondary); margin-top: 8px; max-width: 640px; }

        .tool-section { margin-bottom: 24px; }
        .tool-section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .tool-section-title::before { content: ''; width: 3px; height: 14px; background: var(--accent-cyan); border-radius: 2px; }

        .input, .textarea { width: 100%; padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-family: inherit; font-size: 14px; transition: all var(--transition); outline: none; }
        .input:focus, .textarea:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(6,182,212,.15); }
        .textarea { font-family: 'JetBrains Mono', monospace; font-size: 13px; min-height: 120px; resize: vertical; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition); border: 1px solid transparent; font-family: inherit; }
        .btn:active { transform: scale(.97); }
        .btn-primary { background: var(--accent-cyan); color: var(--bg-primary); border-color: var(--accent-cyan); }
        .btn-primary:hover { background: #22d3ee; }

        .jwt-visual { display: flex; gap: 0; margin-bottom: 16px; border-radius: var(--radius-sm); overflow: hidden; font-family: 'JetBrains Mono', monospace; font-size: 12px; }
        .jwt-part { padding: 8px 14px; word-break: break-all; line-height: 1.5; }
        .jwt-part.header { background: rgba(239,68,68,.15); color: var(--accent-red); }
        .jwt-part.payload { background: rgba(245,158,11,.15); color: var(--accent-yellow); }
        .jwt-part.signature { background: rgba(6,182,212,.15); color: var(--accent-cyan); }

        .jwt-grid { display: grid; gap: 12px; }
        .jwt-card { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 16px; position: relative; }
        .jwt-card-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; }
        .jwt-card-label.header { color: var(--accent-red); }
        .jwt-card-label.payload { color: var(--accent-yellow); }
        .jwt-card-label.signature { color: var(--accent-cyan); }
        .jwt-card pre { font-family: 'JetBrains Mono', monospace; font-size: 13px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; color: var(--text-primary); margin: 0; }
        .jwt-copy { position: absolute; top: 12px; right: 12px; padding: 3px 8px; font-size: 10px; font-weight: 600; background: rgba(6,182,212,.15); color: var(--accent-cyan); border: 1px solid rgba(6,182,212,.3); border-radius: 4px; cursor: pointer; font-family: inherit; transition: all var(--transition); }
        .jwt-copy:hover { background: rgba(6,182,212,.25); }

        .claim-table { width: 100%; font-size: 13px; }
        .claim-table th { text-align: left; padding: 6px 10px; border-bottom: 1px solid var(--border-color); color: var(--text-muted); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; }
        .claim-table td { padding: 6px 10px; border-bottom: 1px solid rgba(255,255,255,.03); }
        .claim-table .claim-key { color: var(--accent-cyan); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
        .claim-table .claim-value { color: var(--text-primary); font-family: 'JetBrains Mono', monospace; font-size: 12px; }
        .claim-table .claim-type { color: var(--text-muted); font-size: 11px; }

        .loading { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; }
        .spinner { width: 18px; height: 18px; border: 2px solid var(--border-color); border-top-color: var(--accent-cyan); border-radius: 50%; animation: spin .6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 1024px) { .sidebar { transform: translateX(calc(var(--sidebar-width) * -1)); } .main-content { margin-left: 0; } }
        @media (max-width: 768px) { .tool-container { padding: 20px 16px 32px; } .jwt-visual { flex-direction: column; } }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand"><a href="/" class="brand-link">← ECHO Toolkit</a></div>
            <nav class="sidebar-nav">
                <div class="nav-category">Categories</div>
                <a href="/#code-tools" class="nav-link active"><span class="nav-link-icon">{ }</span> Code Tools</a>
                <a href="/#dev-utils" class="nav-link"><span class="nav-link-icon">⚙</span> Dev Utils</a>
                <a href="/#writing" class="nav-link"><span class="nav-link-icon">✍</span> Writing</a>
                <a href="/#media" class="nav-link"><span class="nav-link-icon">🎨</span> Media</a>
                <a href="/#social-seo" class="nav-link"><span class="nav-link-icon">📊</span> Social/SEO</a>
                <a href="/#utilities" class="nav-link"><span class="nav-link-icon">🛠</span> Utilities</a>
                <a href="/#ai-tools" class="nav-link"><span class="nav-link-icon">🤖</span> AI Tools</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="tool-container">
                <div class="tool-header">
                    <h1><span class="tool-header-icon">🎫</span> JWT Decoder</h1>
                    <p>Decode JSON Web Tokens to inspect header, payload, and signature. No data is sent to any server.</p>
                </div>

                <!-- Input -->
                <div class="tool-section">
                    <div class="tool-section-title">JWT Token</div>
                    <textarea class="textarea" id="tokenInput" placeholder="Paste your JWT token here (eyJhbGciOiJIUzI1NiIs...)"></textarea>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="runTool()">🔍 Decode Token</button>
                    </div>
                </div>

                <!-- Visual Token Breakdown -->
                <div class="tool-section">
                    <div class="tool-section-title">Token Structure</div>
                    <div class="jwt-visual" id="jwtVisual" style="display:none;">
                        <div class="jwt-part header" id="jwtHeader"></div>
                        <div class="jwt-part payload" id="jwtPayload"></div>
                        <div class="jwt-part signature" id="jwtSignature"></div>
                    </div>
                </div>

                <!-- Decoded Parts -->
                <div class="tool-section">
                    <div class="tool-section-title">Decoded Contents</div>
                    <div id="result">
                        <div style="color:var(--text-muted);font-style:italic;">Decoded JWT will appear here...</div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        async function runTool() {
            const token = document.getElementById('tokenInput').value.trim();
            const resultEl = document.getElementById('result');
            const visualEl = document.getElementById('jwtVisual');

            if (!token) {
                resultEl.innerHTML = '<span style="color:var(--accent-yellow)">Please paste a JWT token first.</span>';
                visualEl.style.display = 'none';
                return;
            }

            resultEl.innerHTML = '<div class="loading"><div class="spinner"></div> Decoding...</div>';
            visualEl.style.display = 'none';

            try {
                const response = await fetch('/tools/code/jwt/decode', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token: token })
                });

                const data = await response.json();

                if (data.error) {
                    resultEl.innerHTML = `<span style="color:var(--accent-red)">${escapeHtml(data.error)}</span>`;
                    visualEl.style.display = 'none';
                    return;
                }

                // Visual breakdown
                const parts = token.split('.');
                if (parts.length === 3) {
                    document.getElementById('jwtHeader').textContent = parts[0];
                    document.getElementById('jwtPayload').textContent = parts[1];
                    document.getElementById('jwtSignature').textContent = parts[2];
                    visualEl.style.display = 'flex';
                }

                // Build decoded cards
                let html = '<div class="jwt-grid">';

                // Header
                html += `
                    <div class="jwt-card">
                        <button class="jwt-copy" onclick="copyJson('headerJson')">Copy</button>
                        <div class="jwt-card-label header">Header (Algorithm &amp; Token Type)</div>
                        <pre id="headerJson">${escapeHtml(JSON.stringify(data.header || {}, null, 2))}</pre>
                    </div>
                `;

                // Payload as table + JSON
                const payload = data.payload || {};
                html += `
                    <div class="jwt-card">
                        <button class="jwt-copy" onclick="copyJson('payloadJson')">Copy</button>
                        <div class="jwt-card-label payload">Payload (Claims)</div>
                        <table class="claim-table">
                            <thead><tr><th>Claim</th><th>Value</th><th>Type</th></tr></thead>
                            <tbody>
                `;
                Object.entries(payload).forEach(([key, value]) => {
                    const type = Array.isArray(value) ? 'array' : typeof value;
                    const displayValue = type === 'object' ? JSON.stringify(value) : String(value);
                    html += `<tr><td class="claim-key">${escapeHtml(key)}</td><td class="claim-value">${escapeHtml(displayValue)}</td><td class="claim-type">${type}</td></tr>`;
                });
                html += `</tbody></table>`;
                html += `<pre id="payloadJson" style="margin-top:12px;">${escapeHtml(JSON.stringify(payload, null, 2))}</pre>`;
                html += `</div>`;

                // Signature
                html += `
                    <div class="jwt-card">
                        <div class="jwt-card-label signature">Signature</div>
                        <pre>${escapeHtml(data.signature || 'N/A')}</pre>
                    </div>
                `;

                html += '</div>';
                resultEl.innerHTML = html;

            } catch (err) {
                resultEl.innerHTML = `<span style="color:var(--accent-red)">Request failed: ${escapeHtml(err.message)}</span>`;
                visualEl.style.display = 'none';
            }
        }

        function copyJson(id) {
            const el = document.getElementById(id);
            if (el) {
                navigator.clipboard.writeText(el.textContent);
            }
        }

        function escapeHtml(str) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(str).replace(/[&<>"']/g, c => map[c]);
        }
    </script>
</body>
</html>

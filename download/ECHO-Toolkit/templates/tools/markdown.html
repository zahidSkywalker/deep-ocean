<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Preview - ECHO Toolkit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
        :root {
            --bg-primary: #0a0e17; --bg-secondary: #111827; --bg-card: #1a2236;
            --bg-input: #0f172a; --border-color: #1e293b; --border-hover: #334155;
            --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
            --accent-cyan: #06b6d4; --accent-green: #10b981; --accent-yellow: #f59e0b;
            --accent-red: #ef4444; --sidebar-width: 260px; --radius: 10px; --radius-sm: 6px;
            --transition: .2s ease;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; min-height: 100vh; }
        a { color: var(--accent-cyan); text-decoration: none; transition: color var(--transition); }
        a:hover { color: #22d3ee; }
        ::selection { background: var(--accent-cyan); color: var(--bg-primary); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }
        .app-layout { display: flex; min-height: 100vh; }

        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 1000; overflow-y: auto; }
        .sidebar-brand { padding: 20px 16px; border-bottom: 1px solid var(--border-color); }
        .brand-link { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: var(--accent-cyan); }
        .brand-link:hover { color: #22d3ee; }
        .sidebar-nav { padding: 16px 12px; flex: 1; }
        .nav-category { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); padding: 8px 12px 4px; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 13px; color: var(--text-secondary); border-radius: var(--radius-sm); transition: all var(--transition); cursor: pointer; }
        .nav-link:hover { color: var(--text-primary); background: rgba(6,182,212,.05); }
        .nav-link.active { color: var(--accent-cyan); background: rgba(6,182,212,.08); }
        .nav-link-icon { width: 20px; text-align: center; font-size: 14px; }

        .main-content { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; min-height: 100vh; }
        .tool-container { max-width: 1400px; width: 100%; margin: 0 auto; padding: 32px; }
        .tool-header { margin-bottom: 24px; }
        .tool-header h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .tool-header-icon { width: 44px; height: 44px; border-radius: var(--radius); background: rgba(6,182,212,.12); border: 1px solid rgba(6,182,212,.2); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .tool-header p { font-size: 14px; color: var(--text-secondary); margin-top: 8px; }

        .split-view { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; height: calc(100vh - 180px); min-height: 400px; }

        .pane { display: flex; flex-direction: column; background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); overflow: hidden; }
        .pane-header { padding: 10px 16px; border-bottom: 1px solid var(--border-color); font-size: 12px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .pane-header-actions { display: flex; gap: 6px; }
        .pane-btn { padding: 3px 8px; font-size: 10px; font-weight: 600; background: rgba(6,182,212,.15); color: var(--accent-cyan); border: 1px solid rgba(6,182,212,.3); border-radius: 4px; cursor: pointer; font-family: inherit; transition: all var(--transition); }
        .pane-btn:hover { background: rgba(6,182,212,.25); }
        .pane-body { flex: 1; overflow-y: auto; }

        .markdown-input {
            width: 100%; height: 100%; padding: 16px;
            background: transparent; border: none; color: var(--text-primary);
            font-family: 'JetBrains Mono', monospace; font-size: 13px;
            line-height: 1.7; resize: none; outline: none;
        }
        .markdown-input::placeholder { color: var(--text-muted); }

        .preview-content {
            padding: 20px; font-family: 'Inter', sans-serif; font-size: 14px;
            line-height: 1.7; color: var(--text-primary);
        }
        .preview-content h1 { font-size: 28px; font-weight: 700; margin: 24px 0 12px; border-bottom: 1px solid var(--border-color); padding-bottom: 8px; }
        .preview-content h2 { font-size: 22px; font-weight: 700; margin: 20px 0 10px; border-bottom: 1px solid var(--border-color); padding-bottom: 6px; }
        .preview-content h3 { font-size: 18px; font-weight: 600; margin: 16px 0 8px; }
        .preview-content h4 { font-size: 16px; font-weight: 600; margin: 14px 0 6px; }
        .preview-content p { margin: 10px 0; color: var(--text-secondary); }
        .preview-content code { font-family: 'JetBrains Mono', monospace; font-size: 0.875em; background: var(--bg-input); padding: 2px 6px; border-radius: 4px; color: var(--accent-cyan); border: 1px solid var(--border-color); }
        .preview-content pre { background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-sm); padding: 14px; overflow-x: auto; margin: 12px 0; }
        .preview-content pre code { background: none; border: none; padding: 0; color: var(--text-primary); }
        .preview-content blockquote { border-left: 3px solid var(--accent-cyan); padding: 8px 16px; margin: 12px 0; background: rgba(6,182,212,.05); border-radius: 0 var(--radius-sm) var(--radius-sm) 0; color: var(--text-secondary); }
        .preview-content ul, .preview-content ol { padding-left: 24px; margin: 10px 0; }
        .preview-content li { margin: 4px 0; color: var(--text-secondary); }
        .preview-content a { color: var(--accent-cyan); }
        .preview-content hr { border: none; border-top: 1px solid var(--border-color); margin: 20px 0; }
        .preview-content table { width: 100%; border-collapse: collapse; margin: 12px 0; }
        .preview-content th, .preview-content td { border: 1px solid var(--border-color); padding: 8px 12px; text-align: left; }
        .preview-content th { background: var(--bg-input); font-weight: 600; font-size: 13px; }
        .preview-content img { max-width: 100%; border-radius: var(--radius-sm); }
        .preview-content .empty { color: var(--text-muted); font-style: italic; }

        .loading { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; }
        .spinner { width: 18px; height: 18px; border: 2px solid var(--border-color); border-top-color: var(--accent-cyan); border-radius: 50%; animation: spin .6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 1024px) { .sidebar { transform: translateX(calc(var(--sidebar-width) * -1)); } .main-content { margin-left: 0; } }
        @media (max-width: 900px) {
            .tool-container { padding: 20px 16px; }
            .split-view { grid-template-columns: 1fr; height: auto; }
            .pane { min-height: 300px; }
        }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand"><a href="/" class="brand-link">← ECHO Toolkit</a></div>
            <nav class="sidebar-nav">
                <div class="nav-category">Categories</div>
                <a href="/#code-tools" class="nav-link active"><span class="nav-link-icon">{ }</span> Code Tools</a>
                <a href="/#dev-utils" class="nav-link"><span class="nav-link-icon">⚙</span> Dev Utils</a>
                <a href="/#writing" class="nav-link"><span class="nav-link-icon">✍</span> Writing</a>
                <a href="/#media" class="nav-link"><span class="nav-link-icon">🎨</span> Media</a>
                <a href="/#social-seo" class="nav-link"><span class="nav-link-icon">📊</span> Social/SEO</a>
                <a href="/#utilities" class="nav-link"><span class="nav-link-icon">🛠</span> Utilities</a>
                <a href="/#ai-tools" class="nav-link"><span class="nav-link-icon">🤖</span> AI Tools</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="tool-container">
                <div class="tool-header">
                    <h1><span class="tool-header-icon">📄</span> Markdown Preview</h1>
                    <p>Write Markdown on the left, see a live rendered preview on the right. Supports full CommonMark syntax.</p>
                </div>

                <div class="split-view">
                    <!-- Editor Pane -->
                    <div class="pane">
                        <div class="pane-header">
                            <span>Markdown</span>
                            <div class="pane-header-actions">
                                <button class="pane-btn" onclick="copyMarkdown()">Copy MD</button>
                                <button class="pane-btn" onclick="clearEditor()">Clear</button>
                            </div>
                        </div>
                        <div class="pane-body">
                            <textarea class="markdown-input" id="markdownInput" placeholder="# Hello World

Write your **markdown** here and see the preview on the right.

## Features
- Bold and *italic* text
- [Links](https://example.com)
- Code blocks
- Tables

> Blockquotes are supported too

```python
print('Hello!')
```"></textarea>
                        </div>
                    </div>

                    <!-- Preview Pane -->
                    <div class="pane">
                        <div class="pane-header">
                            <span>Preview</span>
                            <div class="pane-header-actions">
                                <button class="pane-btn" onclick="copyHtml()">Copy HTML</button>
                            </div>
                        </div>
                        <div class="pane-body">
                            <div class="preview-content" id="previewContent">
                                <div class="empty">Start typing markdown to see the preview...</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        let currentHtml = '';
        let debounceTimer;

        const inputEl = document.getElementById('markdownInput');
        const previewEl = document.getElementById('previewContent');

        // Live preview with debounce
        inputEl.addEventListener('input', () => {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(updatePreview, 400);
        });

        async function updatePreview() {
            const markdown = inputEl.value;

            if (!markdown.trim()) {
                previewEl.innerHTML = '<div class="empty">Start typing markdown to see the preview...</div>';
                currentHtml = '';
                return;
            }

            try {
                const response = await fetch('/tools/code/markdown/preview', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: markdown })
                });

                const data = await response.json();

                if (data.error) {
                    previewEl.innerHTML = `<span style="color:var(--accent-red)">${escapeHtml(data.error)}</span>`;
                    return;
                }

                currentHtml = data.html || data.result || '';
                previewEl.innerHTML = currentHtml;
            } catch (err) {
                // Fallback: show raw markdown if API is unavailable
                previewEl.innerHTML = `<pre style="white-space:pre-wrap;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--text-secondary);padding:16px;">${escapeHtml(markdown)}</pre>`;
            }
        }

        function copyMarkdown() {
            const text = inputEl.value;
            if (text) {
                navigator.clipboard.writeText(text);
            }
        }

        function copyHtml() {
            if (currentHtml) {
                navigator.clipboard.writeText(currentHtml);
            }
        }

        function clearEditor() {
            inputEl.value = '';
            previewEl.innerHTML = '<div class="empty">Start typing markdown to see the preview...</div>';
            currentHtml = '';
        }

        function escapeHtml(str) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(str).replace(/[&<>"']/g, c => map[c]);
        }
    </script>
</body>
</html>

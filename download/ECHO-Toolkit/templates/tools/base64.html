<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base64 Encoder/Decoder - ECHO Toolkit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
        :root {
            --bg-primary: #0a0e17; --bg-secondary: #111827; --bg-card: #1a2236;
            --bg-input: #0f172a; --border-color: #1e293b; --border-hover: #334155;
            --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
            --accent-cyan: #06b6d4; --accent-green: #10b981; --accent-yellow: #f59e0b;
            --accent-red: #ef4444; --sidebar-width: 260px; --radius: 10px; --radius-sm: 6px;
            --transition: .2s ease;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; min-height: 100vh; }
        a { color: var(--accent-cyan); text-decoration: none; transition: color var(--transition); }
        a:hover { color: #22d3ee; }
        ::selection { background: var(--accent-cyan); color: var(--bg-primary); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }
        .app-layout { display: flex; min-height: 100vh; }

        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 1000; overflow-y: auto; }
        .sidebar-brand { padding: 20px 16px; border-bottom: 1px solid var(--border-color); }
        .brand-link { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: var(--accent-cyan); }
        .brand-link:hover { color: #22d3ee; }
        .sidebar-nav { padding: 16px 12px; flex: 1; }
        .nav-category { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); padding: 8px 12px 4px; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 13px; color: var(--text-secondary); border-radius: var(--radius-sm); transition: all var(--transition); cursor: pointer; }
        .nav-link:hover { color: var(--text-primary); background: rgba(6,182,212,.05); }
        .nav-link.active { color: var(--accent-cyan); background: rgba(6,182,212,.08); }
        .nav-link-icon { width: 20px; text-align: center; font-size: 14px; }

        .main-content { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; min-height: 100vh; }
        .tool-container { max-width: 960px; width: 100%; margin: 0 auto; padding: 32px 32px 48px; }
        .tool-header { margin-bottom: 32px; }
        .tool-header h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .tool-header-icon { width: 44px; height: 44px; border-radius: var(--radius); background: rgba(6,182,212,.12); border: 1px solid rgba(6,182,212,.2); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .tool-header p { font-size: 14px; color: var(--text-secondary); margin-top: 8px; max-width: 640px; }

        .tool-section { margin-bottom: 24px; }
        .tool-section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .tool-section-title::before { content: ''; width: 3px; height: 14px; background: var(--accent-cyan); border-radius: 2px; }

        .input, .textarea { width: 100%; padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-family: inherit; font-size: 14px; transition: all var(--transition); outline: none; }
        .input:focus, .textarea:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(6,182,212,.15); }
        .textarea { font-family: 'JetBrains Mono', monospace; font-size: 13px; min-height: 160px; resize: vertical; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition); border: 1px solid transparent; font-family: inherit; }
        .btn:active { transform: scale(.97); }
        .btn-primary { background: var(--accent-cyan); color: var(--bg-primary); border-color: var(--accent-cyan); }
        .btn-primary:hover { background: #22d3ee; }
        .btn-secondary { background: var(--bg-card); color: var(--text-secondary); border-color: var(--border-color); }
        .btn-secondary:hover { color: var(--text-primary); border-color: var(--border-hover); }
        .btn-secondary.active { color: var(--accent-cyan); border-color: var(--accent-cyan); background: rgba(6,182,212,.08); }

        .output-area { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 20px; min-height: 120px; position: relative; font-family: 'JetBrains Mono', monospace; font-size: 13px; white-space: pre-wrap; word-break: break-word; line-height: 1.6; color: var(--text-primary); }
        .output-area.empty { color: var(--text-muted); font-style: italic; font-family: 'Inter', sans-serif; }
        .copy-btn { position: absolute; top: 10px; right: 10px; padding: 4px 10px; font-size: 11px; font-weight: 600; background: rgba(6,182,212,.15); color: var(--accent-cyan); border: 1px solid rgba(6,182,212,.3); border-radius: 4px; cursor: pointer; font-family: inherit; transition: all var(--transition); }
        .copy-btn:hover { background: rgba(6,182,212,.25); }

        .toggle-group { display: flex; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-sm); overflow: hidden; }
        .toggle-option { padding: 7px 16px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; transition: all var(--transition); border: none; background: none; font-family: inherit; }
        .toggle-option.active { background: var(--accent-cyan); color: var(--bg-primary); }
        .toggle-option:hover:not(.active) { color: var(--text-primary); background: rgba(255,255,255,.03); }

        .loading { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; }
        .spinner { width: 18px; height: 18px; border: 2px solid var(--border-color); border-top-color: var(--accent-cyan); border-radius: 50%; animation: spin .6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 1024px) {
            .sidebar { transform: translateX(calc(var(--sidebar-width) * -1)); }
            .main-content { margin-left: 0; }
        }
        @media (max-width: 768px) { .tool-container { padding: 20px 16px 32px; } }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand">
                <a href="/" class="brand-link">← ECHO Toolkit</a>
            </div>
            <nav class="sidebar-nav">
                <div class="nav-category">Categories</div>
                <a href="/#code-tools" class="nav-link active"><span class="nav-link-icon">{ }</span> Code Tools</a>
                <a href="/#dev-utils" class="nav-link"><span class="nav-link-icon">⚙</span> Dev Utils</a>
                <a href="/#writing" class="nav-link"><span class="nav-link-icon">✍</span> Writing</a>
                <a href="/#media" class="nav-link"><span class="nav-link-icon">🎨</span> Media</a>
                <a href="/#social-seo" class="nav-link"><span class="nav-link-icon">📊</span> Social/SEO</a>
                <a href="/#utilities" class="nav-link"><span class="nav-link-icon">🛠</span> Utilities</a>
                <a href="/#ai-tools" class="nav-link"><span class="nav-link-icon">🤖</span> AI Tools</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="tool-container">
                <div class="tool-header">
                    <h1>
                        <span class="tool-header-icon">🔐</span>
                        Base64 Encoder / Decoder
                    </h1>
                    <p>Encode text to Base64 or decode Base64 back to plain text. Supports auto-detection mode.</p>
                </div>

                <!-- Mode Toggle -->
                <div class="tool-section">
                    <div class="tool-section-title">Mode</div>
                    <div class="toggle-group">
                        <button class="toggle-option active" data-action="encode" onclick="setMode(this)">Encode</button>
                        <button class="toggle-option" data-action="decode" onclick="setMode(this)">Decode</button>
                        <button class="toggle-option" data-action="auto" onclick="setMode(this)">Auto-Detect</button>
                    </div>
                </div>

                <!-- Input -->
                <div class="tool-section">
                    <div class="tool-section-title">Input</div>
                    <textarea class="textarea" id="inputText" placeholder="Enter text to encode, or Base64 to decode..."></textarea>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="runTool()">⚡ Convert</button>
                        <button class="btn btn-secondary" onclick="clearAll()">🗑 Clear</button>
                    </div>
                </div>

                <!-- Output -->
                <div class="tool-section">
                    <div class="tool-section-title">Output</div>
                    <div class="output-area empty" id="result">
                        Result will appear here...
                        <button class="copy-btn" id="copyBtn" onclick="copyResult()" style="display:none;">Copy</button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        let currentAction = 'encode';
        let currentResult = '';

        function setMode(btn) {
            document.querySelectorAll('.toggle-option').forEach(el => el.classList.remove('active'));
            btn.classList.add('active');
            currentAction = btn.dataset.action;
        }

        async function runTool() {
            const input = document.getElementById('inputText').value.trim();
            const resultEl = document.getElementById('result');
            const copyBtn = document.getElementById('copyBtn');

            if (!input) {
                resultEl.className = 'output-area';
                resultEl.innerHTML = '<span style="color:var(--accent-yellow)">Please enter text first.</span>';
                return;
            }

            resultEl.className = 'output-area';
            resultEl.innerHTML = '<div class="loading"><div class="spinner"></div> Processing...</div>';
            copyBtn.style.display = 'none';

            try {
                const response = await fetch('/tools/code/base64/convert', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ input: input, action: currentAction })
                });

                const data = await response.json();

                if (data.error) {
                    resultEl.className = 'output-area';
                    resultEl.innerHTML = `<span style="color:var(--accent-red)">${escapeHtml(data.error)}</span>`;
                    copyBtn.style.display = 'none';
                    return;
                }

                currentResult = data.result;
                resultEl.className = 'output-area';
                resultEl.textContent = currentResult;
                copyBtn.style.display = 'block';
            } catch (err) {
                resultEl.className = 'output-area';
                resultEl.innerHTML = `<span style="color:var(--accent-red)">Request failed: ${escapeHtml(err.message)}</span>`;
                copyBtn.style.display = 'none';
            }
        }

        function copyResult() {
            if (currentResult) {
                navigator.clipboard.writeText(currentResult).then(() => {
                    const btn = document.getElementById('copyBtn');
                    btn.textContent = 'Copied!';
                    setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
                });
            }
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            const resultEl = document.getElementById('result');
            resultEl.className = 'output-area empty';
            resultEl.textContent = 'Result will appear here...';
            document.getElementById('copyBtn').style.display = 'none';
            currentResult = '';
        }

        function escapeHtml(str) {
            const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
            return String(str).replace(/[&<>"']/g, c => map[c]);
        }
    </script>
</body>
</html>

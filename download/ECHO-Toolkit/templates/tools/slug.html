<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slug Generator - ECHO Toolkit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
        :root {
            --bg-primary: #0a0e17; --bg-secondary: #111827; --bg-card: #1a2236;
            --bg-input: #0f172a; --border-color: #1e293b; --border-hover: #334155;
            --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-muted: #64748b;
            --accent-cyan: #06b6d4; --accent-green: #10b981; --accent-yellow: #f59e0b;
            --accent-red: #ef4444; --sidebar-width: 260px; --radius: 10px; --radius-sm: 6px;
            --transition: .2s ease;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html { scroll-behavior: smooth; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); line-height: 1.6; min-height: 100vh; }
        a { color: var(--accent-cyan); text-decoration: none; transition: color var(--transition); }
        a:hover { color: #22d3ee; }
        ::selection { background: var(--accent-cyan); color: var(--bg-primary); }
        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-secondary); }
        ::-webkit-scrollbar-thumb { background: var(--border-hover); border-radius: 4px; }
        .app-layout { display: flex; min-height: 100vh; }

        .sidebar { position: fixed; top: 0; left: 0; width: var(--sidebar-width); height: 100vh; background: var(--bg-secondary); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; z-index: 1000; overflow-y: auto; }
        .sidebar-brand { padding: 20px 16px; border-bottom: 1px solid var(--border-color); }
        .brand-link { display: flex; align-items: center; gap: 8px; font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: var(--accent-cyan); }
        .brand-link:hover { color: #22d3ee; }
        .sidebar-nav { padding: 16px 12px; flex: 1; }
        .nav-category { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--text-muted); padding: 8px 12px 4px; }
        .nav-link { display: flex; align-items: center; gap: 10px; padding: 7px 12px; font-size: 13px; color: var(--text-secondary); border-radius: var(--radius-sm); transition: all var(--transition); cursor: pointer; }
        .nav-link:hover { color: var(--text-primary); background: rgba(6,182,212,.05); }
        .nav-link.active { color: var(--accent-cyan); background: rgba(6,182,212,.08); }
        .nav-link-icon { width: 20px; text-align: center; font-size: 14px; }

        .main-content { flex: 1; margin-left: var(--sidebar-width); display: flex; flex-direction: column; min-height: 100vh; }
        .tool-container { max-width: 720px; width: 100%; margin: 0 auto; padding: 32px 32px 48px; }
        .tool-header { margin-bottom: 32px; }
        .tool-header h1 { font-size: 24px; font-weight: 700; display: flex; align-items: center; gap: 12px; }
        .tool-header-icon { width: 44px; height: 44px; border-radius: var(--radius); background: rgba(6,182,212,.12); border: 1px solid rgba(6,182,212,.2); display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .tool-header p { font-size: 14px; color: var(--text-secondary); margin-top: 8px; max-width: 640px; }

        .tool-section { margin-bottom: 24px; }
        .tool-section-title { font-size: 13px; font-weight: 600; color: var(--text-secondary); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .tool-section-title::before { content: ''; width: 3px; height: 14px; background: var(--accent-cyan); border-radius: 2px; }

        .input { width: 100%; padding: 10px 14px; background: var(--bg-input); border: 1px solid var(--border-color); border-radius: var(--radius-sm); color: var(--text-primary); font-family: inherit; font-size: 14px; transition: all var(--transition); outline: none; }
        .input:focus { border-color: var(--accent-cyan); box-shadow: 0 0 0 3px rgba(6,182,212,.15); }
        .input--mono { font-family: 'JetBrains Mono', monospace; font-size: 13px; }

        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
        .btn { display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; font-size: 13px; font-weight: 600; border-radius: var(--radius-sm); cursor: pointer; transition: all var(--transition); border: 1px solid transparent; font-family: inherit; }
        .btn:active { transform: scale(.97); }
        .btn-primary { background: var(--accent-cyan); color: var(--bg-primary); border-color: var(--accent-cyan); }
        .btn-primary:hover { background: #22d3ee; }
        .btn-secondary { background: var(--bg-card); color: var(--text-secondary); border-color: var(--border-color); }
        .btn-secondary:hover { color: var(--text-primary); border-color: var(--border-hover); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }

        .slug-output { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: var(--radius); padding: 20px; position: relative; }
        .slug-result { font-family: 'JetBrains Mono', monospace; font-size: 18px; font-weight: 500; color: var(--accent-cyan); word-break: break-all; line-height: 1.5; padding-right: 80px; }
        .copy-btn { position: absolute; top: 16px; right: 16px; padding: 6px 14px; font-size: 12px; font-weight: 600; background: rgba(6,182,212,.15); color: var(--accent-cyan); border: 1px solid rgba(6,182,212,.3); border-radius: 4px; cursor: pointer; font-family: inherit; transition: all var(--transition); }
        .copy-btn:hover { background: rgba(6,182,212,.25); }

        .info-row { display: flex; gap: 16px; margin-top: 12px; }
        .info-chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; background: rgba(6,182,212,.12); color: var(--accent-cyan); border: 1px solid rgba(6,182,212,.3); }

        .loading { display: flex; align-items: center; gap: 8px; color: var(--text-muted); font-size: 13px; }
        .spinner { width: 18px; height: 18px; border: 2px solid var(--border-color); border-top-color: var(--accent-cyan); border-radius: 50%; animation: spin .6s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        @media (max-width: 1024px) { .sidebar { transform: translateX(calc(var(--sidebar-width) * -1)); } .main-content { margin-left: 0; } }
        @media (max-width: 768px) { .tool-container { padding: 20px 16px 32px; } .form-row { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="app-layout">
        <aside class="sidebar">
            <div class="sidebar-brand"><a href="/" class="brand-link">← ECHO Toolkit</a></div>
            <nav class="sidebar-nav">
                <div class="nav-category">Categories</div>
                <a href="/#code-tools" class="nav-link"><span class="nav-link-icon">{ }</span> Code Tools</a>
                <a href="/#dev-utils" class="nav-link active"><span class="nav-link-icon">⚙</span> Dev Utils</a>
                <a href="/#writing" class="nav-link"><span class="nav-link-icon">✍</span> Writing</a>
                <a href="/#media" class="nav-link"><span class="nav-link-icon">🎨</span> Media</a>
                <a href="/#social-seo" class="nav-link"><span class="nav-link-icon">📊</span> Social/SEO</a>
                <a href="/#utilities" class="nav-link"><span class="nav-link-icon">🛠</span> Utilities</a>
                <a href="/#ai-tools" class="nav-link"><span class="nav-link-icon">🤖</span> AI Tools</a>
            </nav>
        </aside>

        <main class="main-content">
            <div class="tool-container">
                <div class="tool-header">
                    <h1><span class="tool-header-icon">🔗</span> Slug Generator</h1>
                    <p>Convert any text into a URL-friendly slug. Customize the separator and maximum length for SEO-friendly URLs.</p>
                </div>

                <!-- Input -->
                <div class="tool-section">
                    <div class="tool-section-title">Input Text</div>
                    <input type="text" class="input" id="textInput" placeholder="Enter text to slugify...">
                </div>

                <!-- Options -->
                <div class="tool-section">
                    <div class="tool-section-title">Options</div>
                    <div class="form-row">
                        <div>
                            <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:6px;">Separator</label>
                            <input type="text" class="input input--mono" id="separatorInput" value="-" placeholder="-">
                        </div>
                        <div>
                            <label style="font-size:12px;color:var(--text-muted);display:block;margin-bottom:6px;">Max Length (0 = unlimited)</label>
                            <input type="number" class="input" id="maxLengthInput" value="0" min="0" placeholder="0">
                        </div>
                    </div>
                    <div class="btn-group">
                        <button class="btn btn-primary" onclick="generate()">🔗 Generate Slug</button>
                        <button class="btn btn-secondary" onclick="clearAll()">✕ Clear</button>
                    </div>
                </div>

                <!-- Output -->
                <div class="tool-section">
                    <div class="tool-section-title">Result</div>
                    <div class="slug-output" id="slugOutput">
                        <div class="slug-result" id="slugResult" style="color:var(--text-muted);font-style:italic;font-family:'Inter',sans-serif;font-size:14px;">Your slug will appear here...</div>
                        <button class="copy-btn" id="copyBtn" onclick="copySlug()" style="display:none;">Copy</button>
                    </div>
                    <div class="info-row" id="infoRow"></div>
                </div>
            </div>
        </main>
    </div>

    <script src="/static/js/app.js"></script>
    <script>
        async function generate() {
            const text = document.getElementById('textInput').value.trim();
            const separator = document.getElementById('separatorInput').value || '-';
            const maxLength = parseInt(document.getElementById('maxLengthInput').value) || 0;
            const resultEl = document.getElementById('slugResult');
            const copyBtn = document.getElementById('copyBtn');
            const infoRow = document.getElementById('infoRow');

            if (!text) {
                resultEl.style.color = 'var(--accent-yellow)';
                resultEl.style.fontFamily = "'Inter', sans-serif";
                resultEl.style.fontStyle = 'italic';
                resultEl.style.fontSize = '14px';
                resultEl.textContent = 'Please enter text first.';
                copyBtn.style.display = 'none';
                infoRow.innerHTML = '';
                return;
            }

            resultEl.style.color = 'var(--text-muted)';
            resultEl.style.fontFamily = "'Inter', sans-serif";
            resultEl.style.fontStyle = 'italic';
            resultEl.style.fontSize = '14px';
            resultEl.textContent = 'Generating...';
            copyBtn.style.display = 'none';
            infoRow.innerHTML = '';

            try {
                const response = await fetch('/tools/dev/slug/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        separator: separator,
                        max_length: maxLength
                    })
                });

                const data = await response.json();

                if (data.error) {
                    resultEl.style.color = 'var(--accent-red)';
                    resultEl.textContent = data.error;
                    return;
                }

                resultEl.style.color = 'var(--accent-cyan)';
                resultEl.style.fontFamily = "'JetBrains Mono', monospace";
                resultEl.style.fontStyle = 'normal';
                resultEl.style.fontSize = '18px';
                resultEl.textContent = data.slug;
                copyBtn.style.display = 'block';

                // Info chips
                let infoHtml = '';
                if (data.length !== undefined) {
                    infoHtml += `<span class="info-chip">Length: ${data.length}</span>`;
                }
                if (data.words !== undefined) {
                    infoHtml += `<span class="info-chip">Words: ${data.words}</span>`;
                }
                if (data.truncated) {
                    infoHtml += `<span class="info-chip" style="background:rgba(245,158,11,.12);color:var(--accent-yellow);border-color:rgba(245,158,11,.3);">⚠ Truncated</span>`;
                }
                infoRow.innerHTML = infoHtml;
            } catch (err) {
                resultEl.style.color = 'var(--accent-red)';
                resultEl.textContent = 'Request failed: ' + err.message;
            }
        }

        function copySlug() {
            const text = document.getElementById('slugResult').textContent;
            navigator.clipboard.writeText(text).then(() => {
                const btn = document.getElementById('copyBtn');
                btn.textContent = 'Copied!';
                setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
            });
        }

        function clearAll() {
            document.getElementById('textInput').value = '';
            document.getElementById('separatorInput').value = '-';
            document.getElementById('maxLengthInput').value = '0';
            const resultEl = document.getElementById('slugResult');
            resultEl.style.color = 'var(--text-muted)';
            resultEl.style.fontFamily = "'Inter', sans-serif";
            resultEl.style.fontStyle = 'italic';
            resultEl.style.fontSize = '14px';
            resultEl.textContent = 'Your slug will appear here...';
            document.getElementById('copyBtn').style.display = 'none';
            document.getElementById('infoRow').innerHTML = '';
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | ECHO Toolkit</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0D0D0D; color: #e0e0e0; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .container { text-align: center; padding: 2rem; }
        h1 { font-size: 6rem; color: #00D4FF; margin-bottom: 1rem; }
        p { font-size: 1.2rem; color: #888; margin-bottom: 2rem; }
        a { display: inline-block; padding: 0.75rem 2rem; background: #00D4FF; color: #0D0D0D; text-decoration: none; border-radius: 8px; font-weight: 600; }
        a:hover { background: #00b8e6; }
    </style>
    <style>
        :root {
            --bg-primary: #0a0e17; --bg-secondary: #111827; --bg-card: #1a2236;
            --border-color: #1e293b; --text-primary: #f1f5f9; --text-secondary: #94a3b8;
            --text-muted: #64748b; --accent-cyan: #06b6d4; --accent-red: #ef4444;
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); color: var(--text-primary); display: flex; align-items: center; justify-content: center; min-height: 100vh; text-align: center; padding: 32px; }
        a { color: var(--accent-cyan); text-decoration: none; }
        a:hover { color: #22d3ee; }
        .error-code { font-size: 120px; font-weight: 800; color: var(--accent-cyan); line-height: 1; opacity: .3; margin-bottom: 16px; }
        .error-title { font-size: 24px; font-weight: 700; margin-bottom: 8px; }
        .error-msg { color: var(--text-secondary); font-size: 14px; margin-bottom: 32px; max-width: 400px; }
        .error-btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 24px; background: var(--accent-cyan); color: var(--bg-primary); border-radius: 6px; font-weight: 600; font-size: 14px; }
        .error-btn:hover { background: #22d3ee; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <p>Tool not found. It may have been moved or doesn't exist yet.</p>
        <a href="/">Back to Dashboard</a>
    </div>
</body>
</html>
